<svg xmlns="http://www.w3.org/2000/svg" width="600" height="902" viewBox="0 0 600 902" role="img">
<title>Pitchat 抽獎流程三階段總覽</title>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#EEF3FB" stroke-width="1"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
<style>text{font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',sans-serif}</style>
</defs>
<rect width="600" height="902" rx="16" fill="#fff"/>
<rect width="600" height="902" rx="16" fill="url(#grid)" stroke="#D6E2FA" stroke-width="1.5"/>
<rect x="190.0" y="24" width="220" height="60" rx="10" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.5"/>
<text x="300" y="50" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">Instagram API</text>
<text x="300" y="72" font-size="15" fill="#5B6577" font-weight="400" text-anchor="middle">逐頁回傳留言</text>
<line x1="300" y1="84" x2="300" y2="120" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="24" y="124" width="552" height="662" rx="14" fill="#F8FAFF" stroke="#2563EB" stroke-width="2"/>
<path d="M24 160 H576" stroke="#C3D5FB" stroke-width="1.5"/>
<circle cx="46" cy="142" r="5.5" fill="#F87171"/>
<circle cx="64" cy="142" r="5.5" fill="#FBBF24"/>
<circle cx="82" cy="142" r="5.5" fill="#34D399"/>
<text x="300" y="148" font-size="15" fill="#1E3A8A" font-weight="700" text-anchor="middle">全部在你的瀏覽器中執行</text>
<rect x="48" y="180" width="504" height="144" rx="12" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<circle cx="82" cy="216" r="17" fill="#2563EB"/>
<text x="82" y="222" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="110" y="222" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">階段一・讀取與抽樣</text>
<text x="110" y="248" font-size="15" fill="#5B6577" font-weight="400" text-anchor="start">邊讀取邊篩選，用水塘抽樣保留約 1,000 則</text>
<rect x="110" y="266" width="86.0" height="34" rx="17" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="153.0" y="288" font-size="15" fill="#1E3A8A" font-weight="500" text-anchor="middle">排除自己</text>
<rect x="204.0" y="266" width="86.0" height="34" rx="17" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="247.0" y="288" font-size="15" fill="#1E3A8A" font-weight="500" text-anchor="middle">重複留言</text>
<rect x="298.0" y="266" width="86.0" height="34" rx="17" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="341.0" y="288" font-size="15" fill="#1E3A8A" font-weight="500" text-anchor="middle">時間範圍</text>
<line x1="300" y1="324" x2="300" y2="374" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<text x="314" y="355" font-size="15" fill="#2563EB" font-weight="600" text-anchor="start">抽獎名單（約 1,000 則）</text>
<rect x="48" y="378" width="504" height="144" rx="12" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<circle cx="82" cy="414" r="17" fill="#2563EB"/>
<text x="82" y="420" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="110" y="420" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">階段二・條件篩選</text>
<text x="110" y="446" font-size="15" fill="#5B6577" font-weight="400" text-anchor="start">套用進階篩選條件，並確認人數足夠</text>
<rect x="110" y="464" width="86.0" height="34" rx="17" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="153.0" y="486" font-size="15" fill="#1E3A8A" font-weight="500" text-anchor="middle">封鎖名單</text>
<rect x="204.0" y="464" width="71.0" height="34" rx="17" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="239.5" y="486" font-size="15" fill="#1E3A8A" font-weight="500" text-anchor="middle">關鍵字</text>
<rect x="283.0" y="464" width="86.0" height="34" rx="17" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="326.0" y="486" font-size="15" fill="#1E3A8A" font-weight="500" text-anchor="middle">提及人數</text>
<rect x="377.0" y="464" width="86.0" height="34" rx="17" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="420.0" y="486" font-size="15" fill="#1E3A8A" font-weight="500" text-anchor="middle">重複中獎</text>
<line x1="300" y1="522" x2="300" y2="572" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<text x="314" y="553" font-size="15" fill="#2563EB" font-weight="600" text-anchor="start">符合條件的候選人</text>
<rect x="48" y="576" width="504" height="188" rx="12" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<circle cx="82" cy="612" r="17" fill="#2563EB"/>
<text x="82" y="618" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="110" y="618" font-size="19" fill="#1F2937" font-weight="700" text-anchor="start">階段三・隨機抽獎</text>
<text x="110" y="644" font-size="15" fill="#5B6577" font-weight="400" text-anchor="start">依「重複中獎」設定選擇抽獎方式</text>
<rect x="110" y="662" width="307.99999999999994" height="34" rx="17" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="264.0" y="684" font-size="15" fill="#1E3A8A" font-weight="500" text-anchor="middle">允許重複中獎 → 每次隨機抽，可能再抽中</text>
<rect x="110" y="706" width="263.0" height="34" rx="17" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="241.5" y="728" font-size="15" fill="#1E3A8A" font-weight="500" text-anchor="middle">不允許重複中獎 → 洗牌後依序選出</text>
<line x1="300" y1="786" x2="300" y2="824" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="220.0" y="828" width="160" height="50" rx="25" fill="#1E3A8A" stroke="none" stroke-width="1.5"/>
<path d="M245.0 841 h18 v6 a9 9 0 0 1 -18 0 z" fill="#fff"/><path d="M245.0 843 h-5 a5 5 0 0 0 5 7 M263.0 843 h5 a5 5 0 0 1 -5 7" fill="none" stroke="#fff" stroke-width="2"/><rect x="252.0" y="855" width="4" height="5" fill="#fff"/><rect x="247.0" y="860" width="14" height="3" rx="1" fill="#fff"/>
<text x="314" y="859" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">得獎名單</text>
</svg>
