<svg xmlns="http://www.w3.org/2000/svg" width="600" height="642" viewBox="0 0 600 642" role="img">
<title>How the number of comments shrinks from raw comments to winners</title>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#EEF3FB" stroke-width="1"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style>
</defs>
<rect width="600" height="642" rx="16" fill="#fff"/>
<rect width="600" height="642" rx="16" fill="url(#grid)" stroke="#D6E2FA" stroke-width="1.5"/>
<rect x="24.0" y="24" width="552" height="64" rx="12" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.5"/>
<text x="300" y="54" text-anchor="middle" fill="#1E3A8A"><tspan font-size="24" font-weight="800">50,000</tspan><tspan dx="10" font-size="17" font-weight="600">Raw comments</tspan></text>
<text x="300" y="76" font-size="14" fill="#5B6577" font-weight="400" text-anchor="middle">Everything the Instagram API returns</text>
<line x1="300" y1="88" x2="300" y2="148" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="30.749999999999773" y="101" width="538.5000000000005" height="32" rx="16" fill="#FDEDEC" stroke="#C2413B" stroke-width="1.5"/>
<text x="300" y="122" font-size="15" fill="#C2413B" font-weight="600" text-anchor="middle">40,000 removed: your own, duplicates, outside the time range</text>
<rect x="74.0" y="150" width="452" height="64" rx="12" fill="#DCE7FD" stroke="#2563EB" stroke-width="1.5"/>
<text x="300" y="190" text-anchor="middle" fill="#1E3A8A"><tspan font-size="24" font-weight="800">10,000</tspan><tspan dx="10" font-size="17" font-weight="600">Valid comments</tspan></text>
<line x1="300" y1="214" x2="300" y2="274" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="107.24999999999989" y="227" width="385.5000000000002" height="32" rx="16" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<text x="300" y="248" font-size="15" fill="#1E3A8A" font-weight="600" text-anchor="middle">Reservoir sampling: each has a 10% chance</text>
<rect x="120.0" y="276" width="360" height="64" rx="12" fill="#C3D5FB" stroke="#2563EB" stroke-width="1.5"/>
<text x="300" y="316" text-anchor="middle" fill="#1E3A8A"><tspan font-size="24" font-weight="800">1,000</tspan><tspan dx="10" font-size="17" font-weight="600">Candidate pool</tspan></text>
<line x1="300" y1="340" x2="300" y2="400" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="156.00000000000003" y="353" width="287.99999999999994" height="32" rx="16" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<text x="300" y="374" font-size="15" fill="#1E3A8A" font-weight="600" text-anchor="middle">Blocklist · Keywords · Mentions</text>
<rect x="160.0" y="402" width="280" height="64" rx="12" fill="#9DBBF7" stroke="#2563EB" stroke-width="1.5"/>
<text x="300" y="442" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">Qualifying candidates</text>
<line x1="300" y1="466" x2="300" y2="526" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="233.25" y="479" width="133.49999999999997" height="32" rx="16" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<text x="300" y="500" font-size="15" fill="#1E3A8A" font-weight="600" text-anchor="middle">Random draw</text>
<rect x="200.0" y="528" width="200" height="64" rx="12" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="1.5"/>
<path d="M237.0 550 h18 v6 a9 9 0 0 1 -18 0 z" fill="#fff"/><path d="M237.0 552 h-5 a5 5 0 0 0 5 7 M255.0 552 h5 a5 5 0 0 1 -5 7" fill="none" stroke="#fff" stroke-width="2"/><rect x="244.0" y="564" width="4" height="5" fill="#fff"/><rect x="239.0" y="569" width="14" height="3" rx="1" fill="#fff"/>
<text x="314" y="568" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">Winners</text>
<text x="300" y="624" font-size="14" fill="#5B6577" font-weight="400" text-anchor="middle">Figures follow the example in the article</text>
</svg>
