<circle cx="516.0" cy="308" r="14" fill="#FDEDEC" stroke="#C2413B" stroke-width="1.5"/><path d="M511.0 303 l10 10 M521.0 303 l-10 10" stroke="#C2413B" stroke-width="2.4" stroke-linecap="round"/>
</svg>
