<svg xmlns="http://www.w3.org/2000/svg" width="600" height="364" viewBox="0 0 600 364" role="img">
<title>關鍵字篩選的「任一」與「全部」模式範例</title>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#EEF3FB" stroke-width="1"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
<style>text{font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',sans-serif}</style>
</defs>
<rect width="600" height="364" rx="16" fill="#fff"/>
<rect width="600" height="364" rx="16" fill="url(#grid)" stroke="#D6E2FA" stroke-width="1.5"/>
<text x="24" y="50" font-size="17" fill="#1F2937" font-weight="700" text-anchor="start">關鍵字：</text>
<rect x="104.0" y="27" width="58.0" height="34" rx="17" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/><text x="133.0" y="49" font-size="16" fill="#fff" font-weight="500" text-anchor="middle">喜歡</text>
<rect x="172.0" y="27" width="58.0" height="34" rx="17" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/><text x="201.0" y="49" font-size="16" fill="#fff" font-weight="500" text-anchor="middle">推薦</text>
<rect x="24" y="84" width="552" height="256" rx="12" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<path d="M24 96 a12 12 0 0 1 12 -12 H564 a12 12 0 0 1 12 12 V148 H24 z" fill="#EEF3FE"/>
<text x="42" y="123" font-size="16" fill="#1E3A8A" font-weight="700" text-anchor="start">留言</text>
<text x="396.0" y="113" font-size="16" fill="#1E3A8A" font-weight="700" text-anchor="middle">任一模式</text>
<text x="396.0" y="134" font-size="13.5" fill="#5B6577" font-weight="400" text-anchor="middle">包含其中一個</text>
<text x="516.0" y="113" font-size="16" fill="#1E3A8A" font-weight="700" text-anchor="middle">全部模式</text>
<text x="516.0" y="134" font-size="13.5" fill="#5B6577" font-weight="400" text-anchor="middle">兩個都要包含</text>
<line x1="336" y1="84" x2="336" y2="340" stroke="#D6E2FA" stroke-width="1.5"/>
<line x1="456" y1="84" x2="456" y2="340" stroke="#D6E2FA" stroke-width="1.5"/>
<line x1="24" y1="148" x2="576" y2="148" stroke="#D6E2FA" stroke-width="1.5"/>
<text x="42" y="186" font-size="16" fill="#1F2937" xml:space="preserve"><tspan>好</tspan><tspan fill="#2563EB" font-weight="700">喜歡</tspan><tspan>這個顏色！</tspan></text>
<circle cx="396.0" cy="180" r="14" fill="#2563EB"/><path d="M390.0 180 l4.5 4.5 l8 -9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="516.0" cy="180" r="14" fill="#FDEDEC" stroke="#C2413B" stroke-width="1.5"/><path d="M511.0 175 l10 10 M521.0 175 l-10 10" stroke="#C2413B" stroke-width="2.4" stroke-linecap="round"/>
<line x1="24" y1="212" x2="576" y2="212" stroke="#D6E2FA" stroke-width="1.5"/>
<text x="42" y="250" font-size="16" fill="#1F2937" xml:space="preserve"><tspan>真心</tspan><tspan fill="#2563EB" font-weight="700">推薦</tspan><tspan>，我超</tspan><tspan fill="#2563EB" font-weight="700">喜歡</tspan></text>
<circle cx="396.0" cy="244" r="14" fill="#2563EB"/><path d="M390.0 244 l4.5 4.5 l8 -9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="516.0" cy="244" r="14" fill="#2563EB"/><path d="M510.0 244 l4.5 4.5 l8 -9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="24" y1="276" x2="576" y2="276" stroke="#D6E2FA" stroke-width="1.5"/>
