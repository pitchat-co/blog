<svg xmlns="http://www.w3.org/2000/svg" width="600" height="642" viewBox="0 0 600 642" role="img">
<title>從原始留言到得獎者的數量變化</title>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#EEF3FB" stroke-width="1"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
<style>text{font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',sans-serif}</style>
</defs>
<rect width="600" height="642" rx="16" fill="#fff"/>
<rect width="600" height="642" rx="16" fill="url(#grid)" stroke="#D6E2FA" stroke-width="1.5"/>
<rect x="24.0" y="24" width="552" height="64" rx="12" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.5"/>
<text x="300" y="54" text-anchor="middle" fill="#1E3A8A"><tspan font-size="24" font-weight="800">50,000</tspan><tspan dx="10" font-size="17" font-weight="600">原始留言</tspan></text>
<text x="300" y="76" font-size="14" fill="#5B6577" font-weight="400" text-anchor="middle">Instagram API 回傳的所有留言</text>
<line x1="300" y1="88" x2="300" y2="148" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="116.25" y="101" width="367.5" height="32" rx="16" fill="#FDEDEC" stroke="#C2413B" stroke-width="1.5"/>
<text x="300" y="122" font-size="15" fill="#C2413B" font-weight="600" text-anchor="middle">排除 40,000 則：自己的、重複的、超出時間範圍</text>
<rect x="74.0" y="150" width="452" height="64" rx="12" fill="#DCE7FD" stroke="#2563EB" stroke-width="1.5"/>
<text x="300" y="190" text-anchor="middle" fill="#1E3A8A"><tspan font-size="24" font-weight="800">10,000</tspan><tspan dx="10" font-size="17" font-weight="600">有效留言</tspan></text>
<line x1="300" y1="214" x2="300" y2="274" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="164.25" y="227" width="271.5" height="32" rx="16" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<text x="300" y="248" font-size="15" fill="#1E3A8A" font-weight="600" text-anchor="middle">水塘抽樣：每則有 10% 的機率入選</text>
<rect x="120.0" y="276" width="360" height="64" rx="12" fill="#C3D5FB" stroke="#2563EB" stroke-width="1.5"/>
<text x="300" y="316" text-anchor="middle" fill="#1E3A8A"><tspan font-size="24" font-weight="800">1,000</tspan><tspan dx="10" font-size="17" font-weight="600">抽獎名單</tspan></text>
<line x1="300" y1="340" x2="300" y2="400" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="187.5" y="353" width="225.0" height="32" rx="16" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<text x="300" y="374" font-size="15" fill="#1E3A8A" font-weight="600" text-anchor="middle">封鎖名單・關鍵字・提及人數</text>
<rect x="160.0" y="402" width="280" height="64" rx="12" fill="#9DBBF7" stroke="#2563EB" stroke-width="1.5"/>
<text x="300" y="442" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">符合條件的候選人</text>
<line x1="300" y1="466" x2="300" y2="526" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="255.0" y="479" width="90.0" height="32" rx="16" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<text x="300" y="500" font-size="15" fill="#1E3A8A" font-weight="600" text-anchor="middle">隨機抽獎</text>
<rect x="200.0" y="528" width="200" height="64" rx="12" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="1.5"/>
<path d="M246.0 550 h18 v6 a9 9 0 0 1 -18 0 z" fill="#fff"/><path d="M246.0 552 h-5 a5 5 0 0 0 5 7 M264.0 552 h5 a5 5 0 0 1 -5 7" fill="none" stroke="#fff" stroke-width="2"/><rect x="253.0" y="564" width="4" height="5" fill="#fff"/><rect x="248.0" y="569" width="14" height="3" rx="1" fill="#fff"/>
<text x="314" y="568" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">得獎者</text>
<text x="300" y="624" font-size="14" fill="#5B6577" font-weight="400" text-anchor="middle">數字為文中的範例</text>
</svg>
