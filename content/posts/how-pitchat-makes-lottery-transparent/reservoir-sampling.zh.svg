<svg xmlns="http://www.w3.org/2000/svg" width="600" height="866" viewBox="0 0 600 866" role="img">
<title>水塘抽樣示意圖：以 5 格候選池為例</title>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#EEF3FB" stroke-width="1"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
<style>text{font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',sans-serif}</style>
</defs>
<rect width="600" height="866" rx="16" fill="#fff"/>
<rect width="600" height="866" rx="16" fill="url(#grid)" stroke="#D6E2FA" stroke-width="1.5"/>
<defs><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9AA1AD"/></marker></defs>
<rect x="20" y="20" width="560" height="182" rx="12" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<circle cx="57" cy="52" r="13" fill="#2563EB"/><text x="57" y="57.5" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="80" y="58" font-size="18" fill="#1F2937" font-weight="700" text-anchor="start">前 5 則留言：全部放進候選池</text>
<text x="44" y="90" font-size="15" fill="#5B6577" font-weight="400" text-anchor="start">候選池（5 格）</text>
<line x1="108" y1="104" x2="108" y2="124" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="66" y="130" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="108" y="163" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#1</text>
<line x1="204" y1="104" x2="204" y2="124" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="162" y="130" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="204" y="163" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#2</text>
<line x1="300" y1="104" x2="300" y2="124" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="258" y="130" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="300" y="163" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#3</text>
<line x1="396" y1="104" x2="396" y2="124" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="354" y="130" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="396" y="163" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#4</text>
<line x1="492" y1="104" x2="492" y2="124" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<rect x="450" y="130" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="492" y="163" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#5</text>
<rect x="20" y="218" width="560" height="260" rx="12" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<circle cx="57" cy="250" r="13" fill="#2563EB"/><text x="57" y="255.5" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="80" y="256" font-size="18" fill="#1F2937" font-weight="700" text-anchor="start">第 6 則：有 5/6 的機率入選</text>
<text x="44" y="282" font-size="15" fill="#5B6577" font-weight="400" text-anchor="start">入選後隨機取代其中一則（此例取代 #3）</text>
<rect x="258" y="306" width="84" height="52" rx="10" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/><text x="300" y="339" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">#6</text>
<rect x="364" y="312" width="74" height="40" rx="8" fill="#F3F4F6" stroke="#C9CED6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="401" y="338" font-size="16" fill="#9AA1AD" font-weight="700" text-anchor="middle">#3</text>
<line x1="384" y1="332" x2="418" y2="332" stroke="#9AA1AD" stroke-width="2"/>
<text x="448" y="338" font-size="15" fill="#C2413B" font-weight="600" text-anchor="start">移出</text>
<line x1="300" y1="360" x2="300" y2="396" stroke="#2563EB" stroke-width="2" marker-end="url(#ah)"/>
<path d="M328 398 Q364 382 394 356" fill="none" stroke="#9AA1AD" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ahg)"/>
<rect x="66" y="402" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="108" y="435" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#1</text>
<rect x="162" y="402" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="204" y="435" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#2</text>
<rect x="258" y="402" width="84" height="52" rx="10" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/><text x="300" y="435" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">#6</text>
<rect x="354" y="402" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="396" y="435" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#4</text>
<rect x="450" y="402" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="492" y="435" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#5</text>
<rect x="20" y="494" width="560" height="220" rx="12" fill="#fff" stroke="#C3D5FB" stroke-width="1.5"/>
<circle cx="57" cy="526" r="13" fill="#2563EB"/><text x="57" y="531.5" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="80" y="532" font-size="18" fill="#1F2937" font-weight="700" text-anchor="start">第 n 則：入選機率是 5/n</text>
<text x="44" y="558" font-size="15" fill="#5B6577" font-weight="400" text-anchor="start">例如第 100 則的入選機率是 5%。</text>
<text x="44" y="582" font-size="15" fill="#5B6577" font-weight="400" text-anchor="start">越晚出現越難入選，但之後被取代的機會也越少，</text>
<text x="44" y="606" font-size="15" fill="#5B6577" font-weight="400" text-anchor="start">兩者剛好抵銷。</text>
<rect x="66" y="636" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="108" y="669" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#41</text>
<rect x="162" y="636" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="204" y="669" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#6</text>
<rect x="258" y="636" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="300" y="669" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#87</text>
<rect x="354" y="636" width="84" height="52" rx="10" fill="#EEF3FE" stroke="#C3D5FB" stroke-width="1.5"/><text x="396" y="669" font-size="18" fill="#1E3A8A" font-weight="700" text-anchor="middle">#23</text>
<rect x="450" y="636" width="84" height="52" rx="10" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/><text x="492" y="669" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">#100</text>
<rect x="20" y="730" width="560" height="116" rx="12" fill="#1E3A8A" stroke="none" stroke-width="1.5"/>
<text x="300" y="766" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">讀完全部留言後，每則有效留言留在候選池的機率</text>
<text x="300" y="792" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">都相同：5 ÷ 有效留言總數</text>
<text x="300" y="826" font-size="15" fill="#C7D6FA" font-weight="400" text-anchor="middle">Pitchat 實際使用的候選池有 1,000 格</text>
</svg>
